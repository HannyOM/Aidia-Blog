{%- with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="mb-6 space-y-3">
      {% for category, message in messages %}
        {% if category == 'error' %}
        <div class="bg-uv/10 border border-uv/40 text-ink px-4 py-3 rounded-[2px]" role="alert">
        {% elif category == 'warning' %}
        <div class="bg-tile-yellow/10 border border-tile-yellow/60 text-ink px-4 py-3 rounded-[2px]" role="alert">
        {% elif category == 'info' %}
        <div class="bg-mint/10 border border-mint/40 text-ink px-4 py-3 rounded-[2px]" role="alert">
        {% else %}
        <div class="bg-mint/10 border border-mint/40 text-ink px-4 py-3 rounded-[2px]" role="alert">
        {% endif %}
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
{%- endwith %}

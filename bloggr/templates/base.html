<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blog{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <script>
        (function () {
            var stored = null;
            try { stored = localStorage.getItem("theme"); } catch (e) {}
            var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            var dark = stored ? stored === "dark" : prefersDark;
            document.documentElement.classList.toggle("dark", dark);
        })();
    </script>
    <style>
        .ProseMirror {
            outline: none;
            min-height: 300px;
            padding: 1rem;
            color: var(--ink);
        }
        .ProseMirror p {
            margin: 0.5em 0;
        }
        .ProseMirror h1, .ProseMirror h2, .ProseMirror h3,
        .ProseMirror h4, .ProseMirror h5, .ProseMirror h6 {
            margin: 0.75em 0 0.5em;
            color: var(--ink);
        }
        .ProseMirror h1 { font-size: 2.25em; font-weight: 700; }
        .ProseMirror h2 { font-size: 1.875em; font-weight: 600; }
        .ProseMirror h3 { font-size: 1.5em; font-weight: 600; }
        .ProseMirror h4 { font-size: 1.25em; font-weight: 600; }
        .ProseMirror h5 { font-size: 1.125em; font-weight: 600; }
        .ProseMirror h6 { font-size: 1em; font-weight: 600; }
        .ProseMirror ul, .ProseMirror ol {
            padding-left: 1.5em;
            margin: 0.5em 0;
        }
        .ProseMirror blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 1em;
            margin: 0.75em 0;
            color: var(--ink2);
        }
        .ProseMirror pre {
            background: #131313;
            color: #e9e9e9;
            padding: 1em;
            border-radius: 0.5em;
            overflow-x: auto;
        }
        .ProseMirror code {
            background: var(--surface2);
            color: var(--ink);
            padding: 0.125em 0.25em;
            border-radius: 0.25em;
            font-family: "Space Mono", "Courier New", Courier, monospace;
        }
        .ProseMirror pre code {
            background: none;
            padding: 0;
        }
        .ProseMirror a {
            color: var(--linkblue);
            text-decoration: underline;
        }
        .ProseMirror hr {
            border: none;
            border-top: 2px solid var(--line);
            margin: 1em 0;
        }
        .ProseMirror p.is-editor-empty:first-child::before {
            content: attr(data-placeholder);
            float: left;
            color: var(--ink2);
            pointer-events: none;
            height: 0;
        }
        .editor-toolbar button {
            padding: 0.375rem;
            border-radius: 0.375rem;
            color: var(--ink2);
            transition: color 150ms ease, background-color 150ms ease;
        }
        .editor-toolbar button:hover {
            background-color: var(--surface2);
            color: var(--accent);
        }
        .editor-toolbar select {
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
            border: 1px solid var(--line);
            font-size: 0.875rem;
            background: var(--surface);
            color: var(--ink);
        }
    </style>
</head>

<body class="min-h-screen">

    {% block content %}{% endblock %}

    <!-- User Card Popup -->
    <div id="user-card-popup" class="fixed z-50 hidden">
        <div class="bg-surface rounded-2xl border border-line p-4 w-72 shadow-2xl" id="user-card-content">
            <button type="button" id="user-card-close" class="absolute top-2 right-2 text-ink2 hover:text-ink">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
            <div class="flex items-center space-x-3 mb-3">
                <div class="w-12 h-12 rounded-full bg-surface2 border border-line flex items-center justify-center flex-shrink-0">
                    <span id="popup-avatar" class="text-lg font-medium text-ink2"></span>
                </div>
                <div class="min-w-0">
                    <p id="popup-username" class="font-semibold text-ink truncate"></p>
                    <p id="popup-joined" class="text-xs text-ink2"></p>
                </div>
            </div>
            <div id="popup-roles" class="flex flex-wrap gap-1 mb-3"></div>
            <p id="popup-post-count" class="text-sm text-ink2 mb-3"></p>
            <a id="popup-link" href="#" class="block w-full text-center px-4 py-2 bg-mint text-black text-sm font-medium rounded-full hover:bg-white/20 transition-colors">
                View Profile
            </a>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Theme toggle
        document.querySelectorAll('.theme-toggle').forEach(function(toggle) {
            toggle.addEventListener('click', function() {
                const isDark = document.documentElement.classList.toggle('dark');
                try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (e) {}
            });
        });

        // Mobile menu toggle
        document.querySelectorAll('[data-menu-toggle]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                const target = document.getElementById(btn.getAttribute('data-target'));
                if (target) target.classList.toggle('hidden');
            });
        });

        // User card popup
        const popup = document.getElementById('user-card-popup');
        const popupContent = document.getElementById('user-card-content');
        const closeBtn = document.getElementById('user-card-close');
        const triggers = document.querySelectorAll('.user-card-trigger');

        function showPopup(trigger) {
            const userId = trigger.dataset.userId;
            if (!userId) return;

            fetch('/api/user/' + userId)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('popup-avatar').textContent = data.username[0].toUpperCase();
                    document.getElementById('popup-username').textContent = data.username;
                    document.getElementById('popup-joined').textContent = 'Joined ' + data.joined;
                    document.getElementById('popup-link').href = '/profile/' + data.username;
                    document.getElementById('popup-post-count').textContent = data.post_count + ' article' + (data.post_count !== 1 ? 's' : '');

                    const rolesContainer = document.getElementById('popup-roles');
                    rolesContainer.innerHTML = '';
                    data.roles.forEach(role => {
                        const span = document.createElement('span');
                        span.className = 'px-2 py-1 text-[10px] font-mono uppercase tracking-wider text-accent bg-mint/10 rounded-full';
                        span.textContent = role;
                        rolesContainer.appendChild(span);
                    });

                    const rect = trigger.getBoundingClientRect();
                    const popupRect = popupContent.getBoundingClientRect();
                    let top = rect.bottom + 8;
                    let left = rect.left;

                    if (top + popupRect.height > window.innerHeight) {
                        top = rect.top - popupRect.height - 8;
                    }
                    if (left + popupRect.width > window.innerWidth) {
                        left = window.innerWidth - popupRect.width - 16;
                    }

                    popup.style.top = top + 'px';
                    popup.style.left = left + 'px';
                    popup.classList.remove('hidden');
                });
        }

        function hidePopup() {
            popup.classList.add('hidden');
        }

        triggers.forEach(trigger => {
            trigger.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                showPopup(this);
            });
        });

        closeBtn.addEventListener('click', hidePopup);

        document.addEventListener('click', function(e) {
            if (!popup.contains(e.target) && !e.target.closest('.user-card-trigger')) {
                hidePopup();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                hidePopup();
            }
        });
    });
    </script>
</body>

</html>
